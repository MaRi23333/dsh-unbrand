name: 功能建议 / Feature request
description: 提出使用场景或改进建议 / Suggest a use case or improvement
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        请先阅读 README 的范围与限制，用虚构数据描述场景，不要提供私聊、密钥、完整配置或原始请求。
        Read the README's scope and limitations first. Describe your use case with fictional data; do not include private messages, secrets, full configurations, or raw requests.
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / Problem to solve
      description: 描述具体场景及当前行为的不足。 / Describe a concrete use case and what the current behavior lacks.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望行为 / Desired behavior
      description: 给出简短的虚构输入与预期结果示例。 / Give a short fictional input and expected-result example.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 可选替代方案 / Optional alternatives
