name: publish-npm

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'MaRi23333/dsh-unbrand' && github.event.repository.private == false && github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Setup npm for trusted publishing
        run: npm install --global npm@11.19.0

      - name: Verify repository, package and annotated tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          assert.equal(p.name,'dsh-unbrand');
          assert.notEqual(p.private,true);
          assert.match(p.version,/^\d+\.\d+\.\d+$/);
          assert.equal(process.env.RELEASE_TAG,'v'+p.version);
          NODE
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{}")" = "$(git rev-parse HEAD)"

      - name: Reject an existing version or unavailable registry
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          const r=await fetch('https://registry.npmjs.org/'+encodeURIComponent(p.name)+'/'+encodeURIComponent(p.version),{signal:AbortSignal.timeout(30000)});
          assert.equal(r.status,404,'Version must be absent (HTTP 404); an existing version or registry error stops publication');
          NODE

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Verify dependency tree
        run: npm ls --all

      - name: Unit tests with an isolated profile
        env:
          HOME: ${{ runner.temp }}/unbrand-home
          USERPROFILE: ${{ runner.temp }}/unbrand-home
          DSH_HOME: ${{ runner.temp }}/unbrand-home/dsh
        run: npm test

      - name: Exact archive whitelist and extracted-runtime smoke
        run: npm run check:pack

      - name: Verify tracked files remain unchanged
        run: git diff --exit-code

      - name: Publish to npm with OIDC provenance
        run: npm publish --ignore-scripts --access public --provenance --registry=https://registry.npmjs.org/
